name: Deploy forecasting panel
on:
  push:
    branches: [main]
    paths: ['site/**', 'reports/**', 'f1forecast/pages.py', 'f1forecast/analysis_data.py', '.github/workflows/deploy.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * 0,1,6'
    - cron: '17 9 * * 2-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.save.outputs.revision }}
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check official race documents without training data or weights
        run: |
          uv run --locked --python 3.12 python -m f1forecast.recent_results --issued-only --refresh
          python3 -m f1forecast.analysis_data
          python3 -m f1forecast.pages
      - name: Preserve the verified retrospective if it changed
        id: save
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- reports/recent-podiums.json site/data/recent-podiums.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One atomic commit, never overwrite a newer main or upload a private capture.
          revision=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            --rawfile report reports/recent-podiums.json --rawfile public site/data/recent-podiums.json \
            '{query:"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              variables:{input:{branch:{repositoryNameWithOwner:$repo,branchName:"main"},expectedHeadOid:$sha,
              message:{headline:"data: refresh the official race retrospective"},fileChanges:{additions:[
              {path:"reports/recent-podiums.json",contents:($report|@base64)},
              {path:"site/data/recent-podiums.json",contents:($public|@base64)}]}}}}' \
            | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid')
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.refresh.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.refresh.outputs.changed == 'true'))) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.revision || github.sha }}
      - name: Verify forecasts and aggregate analysis
        run: python3 -m f1forecast.pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
